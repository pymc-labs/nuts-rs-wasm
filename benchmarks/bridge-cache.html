<!doctype html><meta charset="utf-8"><title>WASM bridge cache benchmark</title>
<p>Measures cheap WASM callbacks after warmup. Compilation and result serialization are excluded.</p>
<button id="run">Run benchmark</button><pre id="output"></pre>
<script type="module">
import {benchmarkBridge} from './bridge-cache.mjs';
const output = document.getElementById('output');
const button = document.getElementById('run');
button.onclick = async () => {
  button.disabled = true;
  output.textContent = 'Running…';
  try {
    const bytes = await (await fetch('./bridge-callback.wasm')).arrayBuffer();
    window.benchmarkResult = await benchmarkBridge(bytes);
    output.textContent = JSON.stringify(window.benchmarkResult, null, 2);
  } catch (error) {output.textContent = String(error);}
  finally {button.disabled = false;}
};
if (new URL(location.href).searchParams.has('autorun')) button.click();
</script>
