[package]
name = "nuts-browser-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
nuts-rs = { git = "https://github.com/twiecki/nuts-rs", rev = "b6f058e995c4ce2daa128e4790afab8bd4a71356", default-features = false, features = ["arrow"] }
rand = "0.10.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies.arrow]
version = "59.0.0"
default-features = false
features = ["ipc"]
